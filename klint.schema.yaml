$id: https://raw.githubusercontent.com/konvert7/klint/refs/tags/v1.8.0/klint.schema.json
$schema: http://json-schema.org/draft-07/schema#
additionalProperties: false
description: klint configuration. Lives at klint.yaml (or klint.config.json) next to biome.json and knip.json.
properties:
  $schema:
    description: JSON Schema reference. Use ./klint.schema.json for local validation, or a version-tagged URL such as https://raw.githubusercontent.com/konvert7/klint/refs/tags/v0.29.0/klint.schema.json to pin the schema. A tagged URL naming a version other than the installed one raises a klint/schema-version warning.
    type: string
  arch:
    additionalProperties: false
    description: Architecture-as-Code constraints — layers, import boundaries, forbidden patterns, singleton locations, comment budgets. Enforced by the arch engine alongside the rule set.
    properties:
      forbidden:
        description: Forbidden-pattern rules. Block literal strings scoped to a layer.
        items:
          anyOf:
          - additionalProperties: false
            properties:
              in:
                anyOf:
                - type: string
                - items:
                    type: string
                  type: array
                description: Layer name(s) or glob(s) the pattern is forbidden in. Files outside the scope are not checked.
              message:
                description: Required error message explaining why the pattern is forbidden. Shown to the agent so it can fix the call site.
                type: string
              pattern:
                description: 'Pattern to search for, scanned per line. A literal substring by default (e.g. a console logging call). Prefix with `re:` to match a regular expression instead (e.g. `re:\bp-\[\d+px\]`). Regexes must use the common JS/RE2 subset — no lookaround or backreferences — so the TS and Rust engines agree. Note: a literal pattern that itself begins with `re:` cannot be expressed; such a value is always read as a regex.'
                type: string
              severity:
                description: Severity for the arch rule. "error" exits with code 2; "warn" reports but exits 0. (arch rules cannot be "off" — remove the entry instead.)
                enum:
                - error
                - warn
                - null
                type: string
            required:
            - pattern
            - in
            - message
            type: object
          - additionalProperties: false
            properties:
              in:
                anyOf:
                - type: string
                - items:
                    type: string
                  type: array
                description: Layer name(s) or glob(s) the element is forbidden in. Files outside the scope are not checked.
              jsx-element:
                anyOf:
                - type: string
                - items:
                    type: string
                  type: array
                description: JSX intrinsic element name(s) to forbid (e.g. `button`, `input`, `label`). AST-matched on opening and self-closing tag names — robust to whitespace, attributes, and naming collisions like `<buttonGroup>`.
              message:
                description: Required error message explaining why the raw element is forbidden. Typically points at the design-system replacement (e.g. `Use <Button /> from @/components/ui/button`).
                type: string
              severity:
                description: Severity for the arch rule. "error" exits with code 2; "warn" reports but exits 0. (arch rules cannot be "off" — remove the entry instead.)
                enum:
                - error
                - warn
                - null
                type: string
            required:
            - jsx-element
            - in
            - message
            type: object
          description: A forbidden-pattern rule. Blocks either a literal substring (`pattern:`) or a JSX element (`jsx-element:`) inside specific layers.
          examples:
          - |-
            arch:
              forbidden:
                - pattern: "debugLog("
                  in: core
                  message: "Leaks into the agent event stream"
          - |-
            arch:
              forbidden:
                - jsx-element: ["button", "input", "label"]
                  in: ["src/app/**/*.tsx", "src/components/**/*.tsx", "!src/components/ui/**"]
                  message: "Use the design-system primitives in @/components/ui/* instead of raw HTML elements."
        type: array
      imports:
        description: Import-boundary rules. The dependency graph your README claims you have.
        items:
          additionalProperties: false
          description: An import-boundary rule. Restricts which layers a source can or cannot import from.
          examples:
          - |-
            arch:
              imports:
                - from: skills
                  deny: core
                  message: "Skills must be self-contained and portable"
                  severity: warn
          - |-
            arch:
              imports:
                - from: ["src/dao/**"]
                  allow: ["src/dao/**", "src/prisma/**", "src/types/**"]
          properties:
            allow:
              anyOf:
              - type: string
              - items:
                  type: string
                type: array
              description: Allowlist of layer name(s) / glob(s) the source may import from. Anything not matching `allow` is denied.
            deny:
              anyOf:
              - type: string
              - items:
                  type: string
                type: array
              description: Layer name(s) or glob(s) the source is not allowed to import from. Mutually exclusive in spirit with `allow` (use one or the other).
            deny-packages:
              anyOf:
              - type: string
              - items:
                  type: string
                type: array
              description: 'Package specifier(s) the source is not allowed to import — npm packages, `node:` builtins, Python pip packages and stdlib modules, Swift system frameworks, external Rust crates, and C# namespaces or NuGet packages, which `deny`/`allow` cannot reach because they never resolve to a project file. Matching is per segment: `/` in TypeScript/JavaScript, so `next` also covers `next/headers` while `nextra` is unaffected; `.` in Python, Swift, and C#, so `os` also covers `os.path` while `oscrypto` is unaffected; and `::` in Rust, so `tokio` also covers `tokio::sync::Mutex` while `tokio_util` is unaffected. Python, Swift, Rust, and C# sources are checked by the Rust engine.'
            from:
              anyOf:
              - type: string
              - items:
                  type: string
                type: array
              description: Source — a layer name or glob(s) for the files this rule applies to. Imports originating in `from` are checked against `deny`/`allow`.
            message:
              description: Custom error message reported when the rule is violated. Shown in the agent's event stream alongside file:line.
              type: string
            severity:
              description: Severity for the arch rule. "error" exits with code 2; "warn" reports but exits 0. (arch rules cannot be "off" — remove the entry instead.)
              enum:
              - error
              - warn
              - null
              type: string
            type-only:
              description: When set to "allow", `import type` statements that would otherwise be denied are permitted. In Python, imports inside an `if TYPE_CHECKING:` block are exempted the same way. Useful for type-only references across layers.
              enum:
              - allow
              - null
              type: string
          required:
          - from
          type: object
        type: array
      layers:
        additionalProperties:
          items:
            type: string
          type: array
        description: Named architectural zones. Keys are arbitrary layer names; values are glob patterns matching the files in that layer. Other arch rules reference these names instead of repeating globs.
        examples:
        - |-
          layers:
            core:   ["src/hooks/lib/**", "src/tools/**"]
            skills: ["assets/skills/**"]
            dao:    ["src/dao/**"]
        type: object
      maxCommentBlock:
        description: Per-block comment-height caps. Limit how many comment lines may stack together; doc-comments are exempt by default.
        items:
          additionalProperties: false
          description: A per-block comment-height cap. Limits how many comment lines may stack together, so comments stay terse and a long explanation becomes a well-named function instead. Doc-comments are exempt by default.
          examples:
          - |-
            arch:
              maxCommentBlock:
                - limit: 2
                  in: src/**
                  message: "Extract a named function instead of a comment block"
          properties:
            countDocComments:
              default: false
              description: 'Count doc-comments toward the limit. Doc-comments are `/** … */` JSDoc blocks (TS/JS), `///` (Swift and C#), and `///` or `//!` (Rust); ordinary `//`, `/* */`, and `#` comments are always counted. Defaults to false, so documentation is exempt and only explanatory/inline comments are capped. Has no effect on Python: docstrings are string expressions rather than comments, so they never count toward either limit.'
              type: boolean
            ignore:
              anyOf:
              - type: string
              - items:
                  type: string
                type: array
              description: Comment lines matching these patterns are structural, not prose — marker comments a build or codegen step reads, for example — and count toward neither limit. A literal substring by default; prefix with `re:` for a regex. Ignored lines still count in the density denominator (they are physical lines) and still hold a comment block together, so a marker cannot be used to split an over-tall block.
            in:
              anyOf:
              - type: string
              - items:
                  type: string
                type: array
              description: Layer name(s) or glob(s) the limit applies to. Files outside the scope are not checked.
            limit:
              description: Maximum number of consecutive comment lines allowed in a single block. A run of more comment lines than this — e.g. a tall comment stacked above a statement — is a violation, reported at the first offending line.
              format: uint
              minimum: 1
              type: integer
            message:
              description: Optional error message. Defaults to a message naming the consecutive-line limit.
              type: string
            severity:
              description: Severity for the arch rule. "error" exits with code 2; "warn" reports but exits 0. (arch rules cannot be "off" — remove the entry instead.)
              enum:
              - error
              - warn
              - null
              type: string
          required:
          - limit
          - in
          type: object
        type: array
      maxCommentDensity:
        description: Per-file comment-density ceilings. Cap the share of a file that may be explanatory comments; doc-comments are exempt by default.
        items:
          additionalProperties: false
          description: A per-file comment-density ceiling. Caps how much of a file may be explanatory comments — the honest way to push intent into code and names rather than prose (and to keep token cost down), while leaving doc-comments free by default.
          examples:
          - |-
            arch:
              maxCommentDensity:
                - limit: 5
                  in: src/**
                  message: "Encode intent in names, not comments"
          - |-
            arch:
              maxCommentDensity:
                - limit: 10
                  countDocComments: true
                  in: src/**
          properties:
            countDocComments:
              default: false
              description: 'Count doc-comments toward the limit. Doc-comments are `/** … */` JSDoc blocks (TS/JS), `///` (Swift and C#), and `///` or `//!` (Rust); ordinary `//`, `/* */`, and `#` comments are always counted. Defaults to false, so documentation is exempt and only explanatory/inline comments are capped. Has no effect on Python: docstrings are string expressions rather than comments, so they never count toward either limit.'
              type: boolean
            ignore:
              anyOf:
              - type: string
              - items:
                  type: string
                type: array
              description: Comment lines matching these patterns are structural, not prose — marker comments a build or codegen step reads, for example — and count toward neither limit. A literal substring by default; prefix with `re:` for a regex. Ignored lines still count in the density denominator (they are physical lines) and still hold a comment block together, so a marker cannot be used to split an over-tall block.
            in:
              anyOf:
              - type: string
              - items:
                  type: string
                type: array
              description: Layer name(s) or glob(s) the limit applies to. Files outside the scope are not checked.
            limit:
              description: Maximum percentage of a file's physical lines that may be comment lines. Denominator is total physical lines (code + comments + blanks), the same count `maxLines` uses. A file above this ratio is a violation.
              exclusiveMinimum: 0
              format: double
              maximum: 100
              type: number
            message:
              description: Optional error message. Defaults to a message naming the measured density and the limit.
              type: string
            severity:
              description: Severity for the arch rule. "error" exits with code 2; "warn" reports but exits 0. (arch rules cannot be "off" — remove the entry instead.)
              enum:
              - error
              - warn
              - null
              type: string
          required:
          - limit
          - in
          type: object
        type: array
      maxLines:
        description: Per-file line-count limits. Cap how long files in a layer may grow, with different ceilings per scope.
        items:
          additionalProperties: false
          description: A per-file line-count limit. Caps how long any file in scope may grow — the honest way to keep modules small without a formatter dependency.
          examples:
          - |-
            arch:
              maxLines:
                - limit: 300
                  in: src/**
                  message: "Split this module"
          - |-
            arch:
              maxLines:
                - limit: 300
                  in: src/**
                - limit: 600
                  in: tests/**
          properties:
            in:
              anyOf:
              - type: string
              - items:
                  type: string
                type: array
              description: Layer name(s) or glob(s) the limit applies to. Files outside the scope are not checked.
            limit:
              description: Maximum number of physical lines a file may contain. Counts every line including blanks and comments. A file with more lines than this is a violation.
              format: uint
              minimum: 1
              type: integer
            message:
              description: Optional error message. Defaults to a message naming the limit (e.g. 'File exceeds the maximum of 300 lines').
              type: string
            severity:
              description: Severity for the arch rule. "error" exits with code 2; "warn" reports but exits 0. (arch rules cannot be "off" — remove the entry instead.)
              enum:
              - error
              - warn
              - null
              type: string
          required:
          - limit
          - in
          type: object
        type: array
      singleton:
        description: Singleton-location rules. Pin a pattern to one file; every other touch is a violation.
        items:
          anyOf:
          - additionalProperties: false
            properties:
              in:
                anyOf:
                - type: string
                - items:
                    type: string
                  type: array
                description: Optional scope. Limit the scan to these layers/globs; defaults to all files in `include`.
              message:
                type: string
              only:
                description: The single file path where this pattern is allowed. Every other occurrence becomes a violation.
                type: string
              pattern:
                description: 'Pattern whose appearance is allowed only at one location, scanned per line. A literal substring by default (e.g. `process.env.API_KEY`). Prefix with `re:` to match a regular expression instead. Regexes must use the common JS/RE2 subset — no lookaround or backreferences — so the TS and Rust engines agree. Note: a literal pattern that itself begins with `re:` cannot be expressed; such a value is always read as a regex.'
                type: string
              severity:
                description: Severity for the arch rule. "error" exits with code 2; "warn" reports but exits 0. (arch rules cannot be "off" — remove the entry instead.)
                enum:
                - error
                - warn
                - null
                type: string
            required:
            - pattern
            - only
            - message
            type: object
          - additionalProperties: false
            properties:
              in:
                anyOf:
                - type: string
                - items:
                    type: string
                  type: array
                description: Either a single layer name / glob pattern or an array of them. Layer names defined in `arch.layers` are resolved to their glob lists.
              jsx-element:
                anyOf:
                - type: string
                - items:
                    type: string
                  type: array
                description: JSX intrinsic element name(s) allowed only inside the `only` file. AST-matched on tag names.
              message:
                type: string
              only:
                description: The single file path where the element is allowed (typically the design-system primitive that wraps it).
                type: string
              severity:
                description: Severity for the arch rule. "error" exits with code 2; "warn" reports but exits 0. (arch rules cannot be "off" — remove the entry instead.)
                enum:
                - error
                - warn
                - null
                type: string
            required:
            - jsx-element
            - only
            - message
            type: object
          description: A singleton-location rule. Pins a pattern or JSX element to exactly one file — the only honest way to enforce a module of record or a design-system primitive.
          examples:
          - |-
            arch:
              singleton:
                - pattern: "process.env.API_KEY"
                  only: "src/lib/auth.ts"
                  message: "API key access must funnel through the auth module."
          - |-
            arch:
              singleton:
                - jsx-element: "button"
                  only: "src/components/ui/button.tsx"
                  in: ["src/**/*.tsx"]
                  message: "Raw <button> belongs only to the Button primitive."
        type: array
    type: object
  include:
    description: 'Glob patterns selecting which TypeScript files to lint. Prefix with ! to exclude. Defaults to ["."] which lints all .ts files under root. Example: ["src", "klint", "!**/node_modules/**"]'
    items:
      type: string
    type: array
  plugins:
    description: 'Deprecated (v1): named rule bundles. plugins: [sonar] is replaced by rules.recommended: true — run `klint migrate` to upgrade the config in place. Available: "sonar".'
    items:
      enum:
      - sonar
      type: string
    type: array
  root:
    description: Root directory used to resolve include paths and report relative file names. Defaults to the directory containing klint.config.json.
    type: string
  rules:
    anyOf:
    - additionalProperties: false
      description: 'v2 format: rule groups.'
      properties:
        core:
          additionalProperties:
            anyOf:
            - description: Rule severity. "error" exits with code 2; "warn" reports but exits 0; "off" silences.
              enum:
              - error
              - warn
              - off
              type: string
            - additionalProperties: false
              description: Rule options object. Omit severity to default to "error". Add include to scope the rule to specific files.
              properties:
                include:
                  description: 'Glob patterns scoping this rule to a subset of files. Prefix with ! to exclude. Example: ["src/hooks/**", "!src/hooks/scripts/**"]'
                  items:
                    type: string
                  type: array
                severity:
                  description: Rule severity. "error" exits with code 2; "warn" reports but exits 0; "off" silences.
                  enum:
                  - error
                  - warn
                  - off
                  - null
                  type: string
              type: object
          description: Built-in rules by name.
          properties:
            blank-line-after-block:
              anyOf:
              - description: Rule severity. "error" exits with code 2; "warn" reports but exits 0; "off" silences.
                enum:
                - error
                - warn
                - off
                type: string
              - additionalProperties: false
                description: Rule options object. Omit severity to default to "error". Add include to scope the rule to specific files.
                properties:
                  include:
                    description: 'Glob patterns scoping this rule to a subset of files. Prefix with ! to exclude. Example: ["src/hooks/**", "!src/hooks/scripts/**"]'
                    items:
                      type: string
                    type: array
                  severity:
                    description: Rule severity. "error" exits with code 2; "warn" reports but exits 0; "off" silences.
                    enum:
                    - error
                    - warn
                    - off
                    - null
                    type: string
                  statements:
                    description: 'Block statement kinds this rule targets. Defaults to every kind: if, for, while, switch, try, guard, loop, with. match is an alias of switch. return is not a block statement. An empty list turns the rule off.'
                    items:
                      description: A block statement kind the rule targets. match is an alias of switch.
                      enum:
                      - if
                      - for
                      - while
                      - switch
                      - match
                      - try
                      - guard
                      - loop
                      - with
                      type: string
                    type: array
                type: object
              description: Requires a blank line below a block statement (if, for, while, switch/match, try, guard, loop, with) when another statement follows it in the same block, like C# IDE2003. Works on TypeScript/JavaScript, Python, Swift, Rust and C#; `klint --fix` inserts the line.
              examples:
              - 'blank-line-after-block: warn'
              - |-
                blank-line-after-block:
                  severity: warn
                  include: ["src/**"]
                  statements: [if, for, while, switch, try, guard, loop, with]
            blank-line-before-control-flow:
              anyOf:
              - description: Rule severity. "error" exits with code 2; "warn" reports but exits 0; "off" silences.
                enum:
                - error
                - warn
                - off
                type: string
              - additionalProperties: false
                description: Rule options object. Omit severity to default to "error". Add include to scope the rule to specific files.
                properties:
                  allowSetup:
                    description: Skip an if, guard or switch statement whose condition uses a name assigned by the statement directly above it. Defaults to true.
                    type: boolean
                  include:
                    description: 'Glob patterns scoping this rule to a subset of files. Prefix with ! to exclude. Example: ["src/hooks/**", "!src/hooks/scripts/**"]'
                    items:
                      type: string
                    type: array
                  severity:
                    description: Rule severity. "error" exits with code 2; "warn" reports but exits 0; "off" silences.
                    enum:
                    - error
                    - warn
                    - off
                    - null
                    type: string
                  statements:
                    description: 'Statement kinds this rule targets. Defaults to every kind: if, for, while, switch, try, return, guard, loop, with. match is an alias of switch. An empty list turns the rule off.'
                    items:
                      description: A statement kind the rule targets. match is an alias of switch.
                      enum:
                      - if
                      - for
                      - while
                      - switch
                      - match
                      - try
                      - return
                      - guard
                      - loop
                      - with
                      type: string
                    type: array
                type: object
              description: Requires a blank line above a control-flow statement (if, for, while, switch/match, try, return, guard, loop, with) that follows another statement in the same block. Works on TypeScript/JavaScript, Python, Swift, Rust and C#; `klint --fix` inserts the line.
              examples:
              - 'blank-line-before-control-flow: error'
              - |-
                blank-line-before-control-flow:
                  severity: error
                  include: ["src/**", "!src/generated/**"]
                  statements: [if, for, while, switch, try, return, guard, loop, with]
                  allowSetup: true
            cognitive-complexity:
              anyOf:
              - description: Rule severity. "error" exits with code 2; "warn" reports but exits 0; "off" silences.
                enum:
                - error
                - warn
                - off
                type: string
              - additionalProperties: false
                allOf:
                - anyOf:
                  - required:
                    - warn
                  - required:
                    - error
                description: warn and/or error limits. A function gets one diagnostic, at the highest level it exceeds.
                properties:
                  error:
                    description: Report a function above this limit as an error. If error is below warn, only error applies.
                    format: uint32
                    minimum: 1
                    type: integer
                  include:
                    description: 'Glob patterns scoping this rule to a subset of files. Prefix with ! to exclude. Example: ["src/hooks/**", "!src/hooks/scripts/**"]'
                    items:
                      type: string
                    type: array
                  warn:
                    description: Report a function above this limit as a warning.
                    format: uint32
                    minimum: 1
                    type: integer
                type: object
              - description: 'Per-glob limits: the last entry whose include matches a file wins; entries do not merge. An empty list turns the rule off.'
                items:
                  additionalProperties: false
                  allOf:
                  - anyOf:
                    - required:
                      - warn
                    - required:
                      - error
                  description: warn and/or error limits. A function gets one diagnostic, at the highest level it exceeds.
                  properties:
                    error:
                      description: Report a function above this limit as an error. If error is below warn, only error applies.
                      format: uint32
                      minimum: 1
                      type: integer
                    include:
                      description: 'Glob patterns scoping this rule to a subset of files. Prefix with ! to exclude. Example: ["src/hooks/**", "!src/hooks/scripts/**"]'
                      items:
                        type: string
                      type: array
                    warn:
                      description: Report a function above this limit as a warning.
                      format: uint32
                      minimum: 1
                      type: integer
                  type: object
                type: array
              description: Reports every function whose cognitive complexity is above a limit, scored like `eslint-plugin-sonarjs` 3.0.5's `cognitive-complexity` (SonarSource rule S3776). Set `warn` and/or `error` limits (bare `error`/`warn` uses 15); a function gets one diagnostic, at the highest level it exceeds. A list of `{warn, error, include}` entries sets limits per glob, and the last entry whose include matches a file wins. Works on TypeScript/JavaScript, Python, Swift, Rust and C#. Opt-in; no autofix.
              examples:
              - 'cognitive-complexity: error'
              - 'cognitive-complexity: {warn: 10, error: 20}'
              - |-
                cognitive-complexity:
                  - {error: 15}
                  - {warn: 10, error: 20, include: ["scripts/**"]}
            function-length:
              anyOf:
              - description: Rule severity. "error" exits with code 2; "warn" reports but exits 0; "off" silences.
                enum:
                - error
                - warn
                - off
                type: string
              - additionalProperties: false
                allOf:
                - anyOf:
                  - required:
                    - warn
                  - required:
                    - error
                description: warn and/or error limits. A function gets one diagnostic, at the highest level it exceeds.
                properties:
                  error:
                    description: Report a function above this limit as an error. If error is below warn, only error applies.
                    format: uint32
                    minimum: 1
                    type: integer
                  include:
                    description: 'Glob patterns scoping this rule to a subset of files. Prefix with ! to exclude. Example: ["src/hooks/**", "!src/hooks/scripts/**"]'
                    items:
                      type: string
                    type: array
                  skipBlankLines:
                    default: false
                    description: Leave blank lines out of the count. Defaults to false.
                    type: boolean
                  warn:
                    description: Report a function above this limit as a warning.
                    format: uint32
                    minimum: 1
                    type: integer
                type: object
              - description: 'Per-glob limits: the last entry whose include matches a file wins; entries do not merge. An empty list turns the rule off.'
                items:
                  additionalProperties: false
                  allOf:
                  - anyOf:
                    - required:
                      - warn
                    - required:
                      - error
                  description: warn and/or error limits. A function gets one diagnostic, at the highest level it exceeds.
                  properties:
                    error:
                      description: Report a function above this limit as an error. If error is below warn, only error applies.
                      format: uint32
                      minimum: 1
                      type: integer
                    include:
                      description: 'Glob patterns scoping this rule to a subset of files. Prefix with ! to exclude. Example: ["src/hooks/**", "!src/hooks/scripts/**"]'
                      items:
                        type: string
                      type: array
                    skipBlankLines:
                      default: false
                      description: Leave blank lines out of the count. Defaults to false.
                      type: boolean
                    warn:
                      description: Report a function above this limit as a warning.
                      format: uint32
                      minimum: 1
                      type: integer
                  type: object
                type: array
