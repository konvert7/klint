name: release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package, without leading v"
        required: true
        type: string
      publish-release:
        description: "Upload the native archives to the existing vX GitHub Release"
        required: true
        default: false
        type: boolean
      publish-brew:
        description: "Update konvert7/homebrew-tap Formula/klint.rb"
        required: true
        default: false
        type: boolean
      publish-nuget:
        description: "Publish the .NET tool to NuGet.org"
        required: true
        default: false
        type: boolean
      python-repository:
        description: "Python package registry"
        required: true
        default: none
        type: choice
        options:
          - none
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  metadata:
    name: metadata
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    outputs:
      publish-brew: ${{ steps.release.outputs.publish-brew }}
      publish-nuget: ${{ steps.release.outputs.publish-nuget }}
      publish-release: ${{ steps.release.outputs.publish-release }}
      python-environment: ${{ steps.release.outputs.python-environment }}
      python-package: ${{ steps.release.outputs.python-package }}
      python-repository: ${{ steps.release.outputs.python-repository }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_PUBLISH_BREW: ${{ inputs.publish-brew }}
          INPUT_PUBLISH_NUGET: ${{ inputs.publish-nuget }}
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish-release }}
          INPUT_PYTHON_REPOSITORY: ${{ inputs.python-repository }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$EVENT_NAME" == "release" ]]; then
            version="$RELEASE_TAG"
            publish_brew="true"
            publish_nuget="true"
            publish_release="true"
            python_repository="pypi"
          else
            version="$INPUT_VERSION"
            publish_brew="$INPUT_PUBLISH_BREW"
            publish_nuget="$INPUT_PUBLISH_NUGET"
            publish_release="$INPUT_PUBLISH_RELEASE"
            python_repository="$INPUT_PYTHON_REPOSITORY"
          fi
          version="${version#v}"

          if [[ -z "$version" ]]; then
            echo "Release version is required" >&2
            exit 1
          fi
          if [[ "$publish_brew" == "true" && "$publish_release" != "true" ]]; then
            echo "publish-brew requires publish-release so formula URLs point at permanent assets" >&2
            exit 1
          fi

          case "$python_repository" in
            none)
              python_package="klint"
              python_environment=""
              ;;
            testpypi)
              python_package="konvert7-klint"
              python_environment="testpypi"
              ;;
            pypi)
              python_package="klint"
              python_environment="pypi"
              ;;
            *)
              echo "Unsupported Python package repository: $python_repository" >&2
              exit 1
              ;;
          esac

          tag="v$version"

          {
            echo "publish-brew=$publish_brew"
            echo "publish-nuget=$publish_nuget"
            echo "publish-release=$publish_release"
            echo "python-environment=$python_environment"
            echo "python-package=$python_package"
            echo "python-repository=$python_repository"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Release metadata"
            echo ""
            echo "- Version: \`$version\`"
            echo "- Tag: \`$tag\`"
            echo "- Publish release: \`$publish_release\`"
            echo "- Publish Brew: \`$publish_brew\`"
            echo "- Publish NuGet: \`$publish_nuget\`"
            echo "- Python repository: \`$python_repository\` (\`$python_package\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (${{ matrix.package }})
    needs: metadata
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: linux-x64
            nuget-rid: linux-x64
            rust-target: x86_64-unknown-linux-gnu
            binary: klint-rs
            archive: tar.gz
            python-platform-tag: manylinux_2_28_x86_64
          - os: macos-latest
            package: darwin-arm64
            nuget-rid: osx-arm64
            rust-target: aarch64-apple-darwin
            binary: klint-rs
            archive: tar.gz
            python-platform-tag: macosx_11_0_arm64
          - os: macos-15-intel
            package: darwin-x64
            nuget-rid: osx-x64
            rust-target: x86_64-apple-darwin
            binary: klint-rs
            archive: tar.gz
            python-platform-tag: macosx_10_13_x86_64
          - os: windows-latest
            package: win32-x64
            nuget-rid: win-x64
            rust-target: x86_64-pc-windows-msvc
            binary: klint-rs.exe
            archive: zip
            python-platform-tag: win_amd64

    env:
      ARTIFACT: klint-${{ needs.metadata.outputs.version }}-${{ matrix.package }}
      BINARY_PATH: target/${{ matrix.rust-target }}/release/${{ matrix.binary }}
      KLINT_VERSION: ${{ needs.metadata.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Setup Python
        if: needs.metadata.outputs.python-repository != 'none'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Setup Rust
        if: matrix.package != 'linux-x64'
        run: rustup toolchain install stable --profile minimal

      - name: Install Rust target
        if: matrix.package != 'linux-x64'
        run: rustup target add ${{ matrix.rust-target }}

      - name: Rust cache
        if: matrix.package != 'linux-x64'
        uses: Swatinem/rust-cache@v2
        with:
          key: release-packages-${{ matrix.rust-target }}
          workspaces: |
            . -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native binary
        if: matrix.package != 'linux-x64'
        run: cargo build -p klint-rs --release --target ${{ matrix.rust-target }}

      - name: Build manylinux native binary
        if: matrix.package == 'linux-x64'
        run: |
          docker run --rm \
            -v "$PWD:/io" \
            -w /io \
            -e KLINT_VERSION \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash -lc 'curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal && source "$HOME/.cargo/env" && cargo build -p klint-rs --release --target x86_64-unknown-linux-gnu'

      - name: Stage archive directory
        shell: bash
        run: |
          mkdir -p "dist/$ARTIFACT"
          cp "$BINARY_PATH" "dist/$ARTIFACT/klint${{ runner.os == 'Windows' && '.exe' || '' }}"
          cp README.md "dist/$ARTIFACT/README.md"

      - name: Smoke native binary
        shell: bash
        run: |
          "$BINARY_PATH" --version

          set +e
          output="$("$BINARY_PATH" --config tests/fixtures/swift-arch --json)"
          status="$?"
          set -e

          if [[ "$status" != "2" ]]; then
            echo "$output"
            echo "Expected Swift smoke fixture to exit 2, got $status" >&2
            exit 1
          fi

          echo "$output" | grep '"rule":"arch/imports"'
          echo "$output" | grep '"rule":"arch/forbidden"'
          echo "$output" | grep '"rule":"arch/singleton"'

      - name: Package tar archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          tar -czf "dist/$ARTIFACT.tar.gz" -C dist "$ARTIFACT"
          (
            cd dist
            shasum -a 256 "$ARTIFACT.tar.gz" > "$ARTIFACT.tar.gz.sha256"
          )

      - name: Package zip archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/$env:ARTIFACT" -DestinationPath "dist/$env:ARTIFACT.zip"
          $hash = (Get-FileHash "dist/$env:ARTIFACT.zip" -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("dist/$env:ARTIFACT.zip.sha256", "$hash  $env:ARTIFACT.zip`n", [System.Text.Encoding]::ASCII)

      - name: Upload native archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            dist/${{ env.ARTIFACT }}.${{ matrix.archive }}
            dist/${{ env.ARTIFACT }}.${{ matrix.archive }}.sha256
          if-no-files-found: error

      - name: Upload NuGet binary
        if: needs.metadata.outputs.publish-nuget == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-native-${{ matrix.nuget-rid }}
          path: ${{ env.BINARY_PATH }}
          if-no-files-found: error

      - name: Stage Python wheel binary
        if: needs.metadata.outputs.python-repository != 'none'
        run: bun tests/stage-python-wheel.ts --source ${{ env.BINARY_PATH }}

      - name: Stage Python release metadata
        if: needs.metadata.outputs.python-repository != 'none'
        run: bun tools/prepare-python-release.ts --name ${{ needs.metadata.outputs.python-package }} --version ${{ needs.metadata.outputs.version }}

      - name: Smoke Python wheel
        if: needs.metadata.outputs.python-repository != 'none'
        run: bun tests/smoke-python-wheel.ts
        env:
          KLINT_PYTHON_PLAT_NAME: ${{ matrix.python-platform-tag }}

      - name: Upload Python wheel
        if: needs.metadata.outputs.python-repository != 'none'
        uses: actions/upload-artifact@v7
        with:
          name: python-release-${{ matrix.package }}
          path: python/dist/*.whl
          if-no-files-found: error

  github-release:
    name: release assets
    needs: [metadata, build]
    if: needs.metadata.outputs.publish-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Download native archives
        uses: actions/download-artifact@v8
        with:
          pattern: klint-${{ needs.metadata.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Verify downloaded checksums
        shell: bash
        run: |
          cd dist
          shasum -a 256 -c *.sha256

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
        shell: bash
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG not found: native artifacts attach to the release semantic-release created" >&2
            exit 1
          fi
          gh release upload "$TAG" dist/* --clobber

      - name: Generate GitHub App Token for Homebrew tap
        if: needs.metadata.outputs.publish-brew == 'true'
        id: tap-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: konvert7
          repositories: homebrew-tap

      - name: Checkout Homebrew tap
        if: needs.metadata.outputs.publish-brew == 'true'
        uses: actions/checkout@v7
        with:
          repository: konvert7/homebrew-tap
          path: homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}

      - name: Update Homebrew formula
        if: needs.metadata.outputs.publish-brew == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          arm64_sha="$(cut -d ' ' -f 1 "dist/klint-$VERSION-darwin-arm64.tar.gz.sha256")"
          x64_sha="$(cut -d ' ' -f 1 "dist/klint-$VERSION-darwin-x64.tar.gz.sha256")"

          bun tools/generate-homebrew-formula.ts \
            --version "$VERSION" \
            --darwin-arm64-sha "$arm64_sha" \
            --darwin-x64-sha "$x64_sha" \
            --output homebrew-tap/Formula/klint.rb

          cd homebrew-tap
          git config user.name "klint release bot"
          git config user.email "actions@github.com"
          git add Formula/klint.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula already up to date"
          else
            git commit -m "chore(homebrew): update klint native $VERSION"
            git push
          fi

  nuget:
    name: nuget pack and publish
    needs: [metadata, build]
    if: needs.metadata.outputs.publish-nuget == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for NuGet trusted publishing
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download native binaries
        uses: actions/download-artifact@v8
        with:
          pattern: nuget-native-*
          path: downloads

      - name: Stage native binaries
        run: |
          bun tests/stage-nuget-binary.ts --rid linux-x64 --source downloads/nuget-native-linux-x64/klint-rs
          bun tests/stage-nuget-binary.ts --rid osx-x64   --source downloads/nuget-native-osx-x64/klint-rs
          bun tests/stage-nuget-binary.ts --rid osx-arm64 --source downloads/nuget-native-osx-arm64/klint-rs
          bun tests/stage-nuget-binary.ts --rid win-x64   --source downloads/nuget-native-win-x64/klint-rs.exe

      - name: Stage release metadata
        run: bun tools/prepare-nuget-release.ts --version ${{ needs.metadata.outputs.version }}

      - name: Pack
        run: dotnet pack nuget/Klint.Tool.csproj -c Release -o artifacts

      - name: Smoke tool package
        run: bun tests/smoke-nuget-tool.ts

      - name: NuGet login (OIDC -> short-lived key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  python:
    name: python publish
    needs: [metadata, build]
    if: needs.metadata.outputs.python-repository != 'none'
    runs-on: ubuntu-latest
    environment: ${{ needs.metadata.outputs.python-environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download Python wheels
        uses: actions/download-artifact@v8
        with:
          pattern: python-release-*
          path: python/dist
          merge-multiple: true

      - name: Publish to TestPyPI
        if: needs.metadata.outputs.python-repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: needs.metadata.outputs.python-repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
