name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # 2026-11-10: test every shipped CPU; arm runners per https://github.com/actions/partner-runner-images
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-latest,
            macos-15-intel,
            windows-latest,
            windows-11-arm,
          ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        continue-on-error: true
        run: bun audit --audit-level=high

      - name: Check (lint + format)
        run: bun run check

      - name: Type-check
        run: bun run type-check

      - name: Knip
        run: bun run knip

      - name: jscpd
        run: bun run jscpd

      - name: Klint
        run: bun run klint

      - name: Madge
        run: bun run madge

      - name: Line endings
        run: bun run lf

      - name: Exact dependency versions
        run: bun run exact-versions

      - name: Lockfiles match manifests
        run: bun run lock:check

      - name: Secretlint
        run: bun run secretlint

      - name: Rust debug build
        run: cargo build -p klint-rs

      - name: Test
        run: bun run test

      - name: Rust format
        run: cargo fmt --check

      - name: Rust check
        run: cargo check -p klint-rs

      - name: Rust clippy
        run: cargo clippy -p klint-rs --all-targets -- -D warnings

      - name: Rust test
        run: cargo test -p klint-rs

      - name: Rust release build
        run: cargo build -p klint-rs --release

      - name: Check Windows binary needs no VC++ runtime
        if: runner.os == 'Windows'
        shell: bash
        run: "! grep -qai vcruntime140.dll target/release/klint-rs.exe"

      - name: Stage native package binary
        run: bun run native:stage

      - name: Smoke native package binary
        run: bun run native:smoke

      - name: Pack check
        run: bun run pack:check

      - name: Setup Python (linux wheel smoke)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Stage Python wheel (linux)
        if: matrix.os == 'ubuntu-latest'
        run: bun tests/stage-python-wheel.ts --source target/release/klint-rs

      - name: Smoke Python wheel (linux)
        if: matrix.os == 'ubuntu-latest'
        run: bun tests/smoke-python-wheel.ts

  test-musl:
    name: test (alpine x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Alpine cache
        uses: actions/cache@v4
        with:
          path: |
            target
            .alpine-cache
          key: alpine-${{ hashFiles('Cargo.lock', 'bun.lock') }}
          restore-keys: alpine-

      - name: Test on Alpine
        # 2026-11-10: bun@1.3 from npm ships the musl build; matches setup-bun's "1.3" line
        run: |
          mkdir -p .alpine-cache/cargo-registry .alpine-cache/bun
          docker run --rm -e CI -e GITHUB_BASE_REF -v "$PWD:/io" -w /io \
            -v "$PWD/.alpine-cache/cargo-registry:/usr/local/cargo/registry" \
            -e BUN_INSTALL_CACHE_DIR=/io/.alpine-cache/bun \
            rust:1-alpine sh -euc '
            apk add -q bash nodejs npm git musl-dev libstdc++ libgcc tar
            git config --global --add safe.directory /io
            npm install -g --silent bun@1.3
            bun install --frozen-lockfile
            cargo build -p klint-rs
            bun run test
            cargo test -p klint-rs
            cargo build -p klint-rs --release
            bun run native:stage
            bun run native:smoke
          '

  native:
    name: native (${{ matrix.package }})
    # Cross-platform release artifacts feed the release job; the test matrix
    # already release-builds and smokes native packaging per-OS on PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: linux-x64
            rust-target: x86_64-unknown-linux-gnu
            binary: klint-rs
            # 2026-11-10: glibc 2.28 floor, runner-built 1.0.0 needed 2.39 and warned on Debian 12; https://github.com/pypa/manylinux
            manylinux-image: quay.io/pypa/manylinux_2_28_x86_64
          # 2026-11-10: Alpine (node:alpine) needs musl, the glibc build cannot start there
          - os: ubuntu-latest
            package: linux-x64-musl
            rust-target: x86_64-unknown-linux-musl
            binary: klint-rs
          # 2026-11-10: arm64 Linux (Docker on Apple Silicon, Graviton); native runner https://github.com/actions/partner-runner-images
          - os: ubuntu-24.04-arm
            package: linux-arm64
            rust-target: aarch64-unknown-linux-gnu
            binary: klint-rs
            # 2026-11-10: glibc 2.28 floor, runner-built 1.0.0 needed 2.39 and failed on Debian 12; https://github.com/pypa/manylinux
            manylinux-image: quay.io/pypa/manylinux_2_28_aarch64
          - os: macos-latest
            package: darwin-arm64
            rust-target: aarch64-apple-darwin
            binary: klint-rs
          - os: macos-latest
            package: darwin-x64
            rust-target: x86_64-apple-darwin
            binary: klint-rs
          - os: windows-latest
            package: win32-x64
            rust-target: x86_64-pc-windows-msvc
            binary: klint-rs.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Setup Rust
        if: matrix.manylinux-image == ''
        run: rustup toolchain install stable --profile minimal

      - name: Install Rust target
        if: matrix.manylinux-image == ''
        run: rustup target add ${{ matrix.rust-target }}

      - name: Install musl C toolchain
        if: matrix.package == 'linux-x64-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Rust cache
        if: matrix.manylinux-image == ''
        uses: Swatinem/rust-cache@v2
        with:
          key: native-${{ matrix.rust-target }}
          workspaces: |
            . -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native binary
        if: matrix.manylinux-image == ''
        run: cargo build -p klint-rs --release --target ${{ matrix.rust-target }}

      - name: Build manylinux native binary
        if: matrix.manylinux-image != ''
        run: |
          docker run --rm \
            -v "$PWD:/io" \
            -w /io \
            ${{ matrix.manylinux-image }} \
            bash -lc 'curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal && source "$HOME/.cargo/env" && cargo build -p klint-rs --release --target ${{ matrix.rust-target }}'

      - name: Stage native package binary
        run: bun tests/stage-native-binary.ts --package ${{ matrix.package }} --source target/${{ matrix.rust-target }}/release/${{ matrix.binary }}

      - name: Upload native package binary
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.package }}
          path: npm/native/${{ matrix.package }}/bin/*
          if-no-files-found: error

  release:
    needs: [test, test-musl, native]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download native darwin-arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: native-darwin-arm64
          path: npm/native/darwin-arm64/bin

      - name: Download native darwin-x64 binary
        uses: actions/download-artifact@v8
        with:
          name: native-darwin-x64
          path: npm/native/darwin-x64/bin

      - name: Download native linux-x64 binary
        uses: actions/download-artifact@v8
        with:
          name: native-linux-x64
          path: npm/native/linux-x64/bin

      - name: Download native linux-x64-musl binary
        uses: actions/download-artifact@v8
        with:
          name: native-linux-x64-musl
          path: npm/native/linux-x64-musl/bin

      - name: Download native linux-arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: native-linux-arm64
          path: npm/native/linux-arm64/bin

      - name: Download native win32-x64 binary
        uses: actions/download-artifact@v8
        with:
          name: native-win32-x64
          path: npm/native/win32-x64/bin

      - name: Authenticate with crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Release
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
