name: mutation

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  mutation-ts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the merge-base against the PR base branch resolves.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Setup Rust
        # check-lock's tests call cargo; a cold first call installs rust-toolchain.toml's
        # components and outlasts bun's 5s test timeout.
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Mutation-test the changed TypeScript lines
        run: bun run test:mutate:diff "origin/${{ github.event.pull_request.base.ref }}"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-ts
          path: reports/mutation.html
          if-no-files-found: ignore

  mutation-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the merge-base against the PR base branch resolves.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked

      - name: Mutation-test the changed Rust lines
        run: bun run test:mutate:rust:diff "origin/${{ github.event.pull_request.base.ref }}"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-rust
          path: mutants.out
          if-no-files-found: ignore
