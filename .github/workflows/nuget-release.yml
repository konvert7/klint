name: nuget-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without leading v"
        required: true
        type: string

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          version="${{ inputs.version }}"
          version="${version#v}"
          if [[ -z "$version" ]]; then
            echo "NuGet release version is required" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "NuGet release version: $version" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (${{ matrix.rid }})
    needs: metadata
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            rust-target: x86_64-unknown-linux-gnu
            binary: klint-rs
          - os: macos-latest
            rid: osx-arm64
            rust-target: aarch64-apple-darwin
            binary: klint-rs
          - os: macos-15-intel
            rid: osx-x64
            rust-target: x86_64-apple-darwin
            binary: klint-rs
          - os: windows-latest
            rid: win-x64
            rust-target: x86_64-pc-windows-msvc
            binary: klint-rs.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install Rust target
        run: rustup target add ${{ matrix.rust-target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: nuget-release-${{ matrix.rust-target }}
          workspaces: |
            . -> target

      - name: Build native binary
        run: cargo build -p klint-rs --release --target ${{ matrix.rust-target }}
        env:
          KLINT_VERSION: ${{ needs.metadata.outputs.version }}

      - name: Upload native binary
        uses: actions/upload-artifact@v7
        with:
          name: nuget-native-${{ matrix.rid }}
          path: target/${{ matrix.rust-target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  publish:
    name: pack and publish
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for NuGet trusted publishing
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download native binaries
        uses: actions/download-artifact@v8
        with:
          pattern: nuget-native-*
          path: downloads

      - name: Stage native binaries
        run: |
          bun tests/stage-nuget-binary.ts --rid linux-x64 --source downloads/nuget-native-linux-x64/klint-rs
          bun tests/stage-nuget-binary.ts --rid osx-x64   --source downloads/nuget-native-osx-x64/klint-rs
          bun tests/stage-nuget-binary.ts --rid osx-arm64 --source downloads/nuget-native-osx-arm64/klint-rs
          bun tests/stage-nuget-binary.ts --rid win-x64   --source downloads/nuget-native-win-x64/klint-rs.exe

      - name: Stage release metadata
        run: bun tools/prepare-nuget-release.ts --version ${{ needs.metadata.outputs.version }}

      - name: Pack
        run: dotnet pack nuget/Klint.Tool.csproj -c Release -o artifacts

      - name: Smoke tool package
        run: bun tests/smoke-nuget-tool.ts

      - name: NuGet login (OIDC -> short-lived key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
